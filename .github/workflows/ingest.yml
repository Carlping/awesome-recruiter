name: Ingest anonymous review

on:
  repository_dispatch:
    types: [new_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Save dispatch payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > payload.json
      - run: python scripts/ingest.py --payload payload.json
      - run: python scripts/validate.py
      - name: Read recruiter company
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("payload.json", encoding="utf-8") as handle:
              company = json.load(handle)["review"].get("recruiter", {}).get("company", "未具名公司")
          print(f"company={company}")
          PY
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: ingest/${{ github.run_id }}
          title: 新增評價：${{ steps.meta.outputs.company }}
          labels: review
          body: |
            此 PR 由匿名 Google Form → Apps Script → repository_dispatch 自動建立。
            請依專案治理規範審查後合併。
